name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          target-branch: master

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Publish Windows Native AOT
        run: >
          dotnet publish Scribble.Desktop/Scribble.Desktop.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:Version=${{ needs.release-please.outputs.version }}
          -o publish/windows

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          # Remove PDB symbol files before archiving
          Remove-Item -Path "publish/windows/*.pdb" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "publish/windows/*" -DestinationPath "Scribble-win-x64.zip"

      - name: Upload Windows Assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} Scribble-win-x64.zip --clobber
